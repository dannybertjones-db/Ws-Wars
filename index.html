<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Top Down Driver - Wednesbury Style</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family: monospace;
}
canvas{
    display:block;
}
#ui {
    position: absolute;
    top: 10px;
    right: 20px; /* Moved to top right to match GTA */
    color: #00ff00;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 2px 2px #000;
    pointer-events: none;
    z-index: 10;
}
</style>
</head>
<body>

<div id="ui">SCORE: <span id="score">80540</span></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const map = new Image();
map.src = "map.jpg";

map.onerror = function() {
    alert("Error: Could not load map.jpg! Make sure you uploaded your map image to GitHub and named it exactly 'map.jpg'. A fallback map will be created so you can still play.");

    // Generate a fallback map (simple streets) so the game can run without an external image.
    const w = 1200;
    const h = 1200;
    const fallback = document.createElement('canvas');
    fallback.width = w;
    fallback.height = h;
    const fctx = fallback.getContext('2d');

    // Ground
    fctx.fillStyle = '#2b2b2b';
    fctx.fillRect(0,0,w,h);

    // Roads
    fctx.fillStyle = '#444';
    for(let y=150; y<h; y+=250){
        fctx.fillRect(0,y,w,80);
    }
    for(let x=150; x<w; x+=250){
        fctx.fillRect(x,0,80,h);
    }

    // Lane centers
    fctx.fillStyle = '#666';
    for(let y=150; y<h; y+=250){
        fctx.fillRect(0,y+22,w,36);
    }
    for(let x=150; x<w; x+=250){
        fctx.fillRect(x+22,0,36,h);
    }

    // Buildings
    fctx.fillStyle = '#111';
    for(let i=0;i<50;i++){
        const bx = Math.random()*(w-120);
        const by = Math.random()*(h-120);
        if(Math.random()>0.7) fctx.fillRect(bx,by,40+Math.random()*80,40+Math.random()*80);
    }

    map.src = fallback.toDataURL();
};

const collisionCanvas = document.createElement("canvas");
const collisionCtx = collisionCanvas.getContext("2d", { willReadFrequently: true });

const player = {
    x: 600,
    y: 600,
    angle: 0,
    speed: 0,
    width: 22,
    height: 38
};

const keys = {};

window.addEventListener("keydown", e => keys[e.key]=true);
window.addEventListener("keyup", e => keys[e.key]=false);

function startGame(){
    collisionCanvas.width = map.width;
    collisionCanvas.height = map.height;
    try {
        collisionCtx.drawImage(map, 0, 0);
        collisionCtx.getImageData(0, 0, 1, 1);
    } catch (e) {
        alert("Security Error: The browser is blocking the game from reading the map pixels. Run this through a local server (for example: 'python -m http.server' in the project folder) rather than opening the file directly.");
        return;
    }

    requestAnimationFrame(gameLoop);
}

map.onload = () => {
    startGame();
};

function isDrivable(x, y) {
    if (x < 0 || y < 0 || x >= collisionCanvas.width || y >= collisionCanvas.height) return false;
    const data = collisionCtx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
    const r = data[0], g = data[1], b = data[2];
    const brightness = (r + g + b) / 3;
    return brightness > 50; 
}

function update(){
    if(keys["ArrowUp"] || keys["w"]) player.speed += 0.12;
    if(keys["ArrowDown"] || keys["s"]) player.speed -= 0.12;
    if (Math.abs(player.speed) > 0.1) {
        const steerDir = player.speed > 0 ? 1 : -1;
        if(keys["ArrowLeft"] || keys["a"]) player.angle -= 0.05 * steerDir;
        if(keys["ArrowRight"] || keys["d"]) player.angle += 0.05 * steerDir;
    }

    player.speed *= 0.96;

    if(player.speed > 6) player.speed = 6;
    if(player.speed < -2.5) player.speed = -2.5;

    const nx = player.x + Math.sin(player.angle) * player.speed;
    const ny = player.y - Math.cos(player.angle) * player.speed;

    if(isDrivable(nx, ny)){
        player.x = nx;
        player.y = ny;
    } else {
        player.speed *= -0.4;
    }
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const camX = player.x - canvas.width/2;
    const camY = player.y - canvas.height/2;

    if(map.complete && map.width && map.height) {
        ctx.drawImage(map, -camX, -camY);
    } else {
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(player.angle);

    // Car Body
    ctx.fillStyle = "#b53385";
    ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
    
    // Roof / Windshield
    ctx.fillStyle = "#333";
    ctx.fillRect(-player.width/2 + 3, -player.height/2 + 8, player.width - 6, player.height - 16);

    // Headlights
    ctx.fillStyle = "#ffffe0";
    ctx.fillRect(-player.width/2 + 2, -player.height/2, 3, 3);
    ctx.fillRect(player.width/2 - 5, -player.height/2, 3, 3);

    // Taillights
    ctx.fillStyle = "#ff0000";
    ctx.fillRect(-player.width/2 + 2, player.height/2 - 3, 4, 3);
    ctx.fillRect(player.width/2 - 6, player.height/2 - 3, 4, 3);

    ctx.restore();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

</script>
</body>
</html>
