<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Top Down Driver - Wednesbury Style</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family: monospace;
}
canvas{
    display:block;
}
#ui {
    position: absolute;
    top: 10px;
    right: 20px;
    color: #00ff00;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 2px 2px #000;
    pointer-events: none;
    z-index: 10;
}
</style>
</head>
<body>

<div id="ui">SCORE: <span id="score">80540</span></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Handle window resizing
window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

const map = new Image();
map.src = "map.jpg";

map.onerror = function() {
    alert("Error: Could not load map.jpg! Make sure you uploaded your map image to GitHub and named it exactly 'map.jpg'.");
};

const collisionCanvas = document.createElement("canvas");
const collisionCtx = collisionCanvas.getContext("2d", { willReadFrequently: true });

const player = {
    x: 600,
    y: 600,
    angle: 0,
    speed: 0,
    width: 22,
    height: 38
};

const keys = {};

window.addEventListener("keydown", e => keys[e.key]=true);
window.addEventListener("keyup", e => keys[e.key]=false);

map.onload = () => {
    collisionCanvas.width = map.width;
    collisionCanvas.height = map.height;
    
    try {
        collisionCtx.drawImage(map, 0, 0);
        collisionCtx.getImageData(0, 0, 1, 1); 
    } catch (e) {
        alert("Security Error: The browser is blocking the game from reading the map pixels. This usually happens if you open the file locally instead of viewing it on GitHub Pages.");
        return;
    }

    requestAnimationFrame(gameLoop);
};

function isDrivable(x, y) {
    if (x < 0 || y < 0 || x >= collisionCanvas.width || y >= collisionCanvas.height) return false;
    const data = collisionCtx.getImageData(x, y, 1, 1).data;
    const r = data[0], g = data[1], b = data[2];
    
    // We assume light areas (roads/paths on Google Maps) are drivable
    const brightness = (r + g + b) / 3;
    return brightness > 50; 
}

function update(){
    if(keys["ArrowUp"] || keys["w"]) player.speed += 0.15;
    if(keys["ArrowDown"] || keys["s"]) player.speed -= 0.15;
    
    // Only allow turning if the car is moving
    if (Math.abs(player.speed) > 0.1) {
        // Reverse steering direction if going backwards
        const steerDir = player.speed > 0 ? 1 : -1;
        if(keys["ArrowLeft"] || keys["a"]) player.angle -= 0.05 * steerDir;
        if(keys["ArrowRight"] || keys["d"]) player.angle += 0.05 * steerDir;
    }

    player.speed *= 0.95; // Friction

    if(player.speed > 7) player.speed = 7;
    if(player.speed < -3) player.speed = -3;

    const nx = player.x + Math.sin(player.angle) * player.speed;
    const ny = player.y - Math.cos(player.angle) * player.speed;

    if(isDrivable(nx, ny)){
        player.x = nx;
        player.y = ny;
    } else {
        player.speed *= -0.4; // Bounce off non-drivable areas (dark green parks, text, etc)
    }
}

function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const camX = player.x - canvas.width/2;
    const camY = player.y - canvas.height/2;

    if(map.complete && map.naturalWidth !== 0) {
        ctx.drawImage(map, -camX, -camY);
    }

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(player.angle);

    // Car Body
    ctx.fillStyle = "#b53385";
    ctx.fillRect(-player.width/2, -player.height/2, player.width, player.height);
    
    // Roof / Windshield
    ctx.fillStyle = "#333";
    ctx.fillRect(-player.width/2 + 3, -player.height/2 + 8, player.width - 6, player.height - 16);

    // Headlights
    ctx.fillStyle = "#ffffe0";
    ctx.fillRect(-player.width/2 + 2, -player.height/2, 3, 3);
    ctx.fillRect(player.width/2 - 5, -player.height/2, 3, 3);

    // Taillights
    ctx.fillStyle = "#ff0000";
    ctx.fillRect(-player.width/2 + 2, player.height/2 - 3, 4, 3);
    ctx.fillRect(player.width/2 - 6, player.height/2 - 3, 4, 3);

    ctx.restore();
}

function gameLoop(){
    update();
    draw();
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
